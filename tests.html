<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusBite — Automated Regression Test Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body class="test-page-body">
  <div id="toast-container" class="toast-container"></div>
  <div class="test-container">
    <div class="test-header">
      <div>
        <span class="editorial-eyebrow">QUALITY ASSURANCE & REGRESSION VERIFICATION</span>
        <h1 class="test-title">CampusBite Test Suite</h1>
        <p class="test-desc-text">Validates the 7 confirmed defects, state transitions, idempotency, and operational features.</p>
      </div>
      <div id="status-badge" class="badge-pass">RUNNING TESTS...</div>
    </div>

    <div class="summary-card">
      <div class="metric-box">
        <span class="metric-label-mono">TOTAL TESTS</span>
        <div id="metric-total" class="metric-num">0</div>
      </div>
      <div class="metric-box">
        <span class="metric-label-mono">PASSED</span>
        <div id="metric-passed" class="metric-num metric-passed-green">0</div>
      </div>
      <div class="metric-box">
        <span class="metric-label-mono">EXECUTION TIME</span>
        <div id="metric-time" class="metric-num metric-time-compact">0 ms</div>
      </div>
    </div>

    <div class="test-controls-bar">
      <h3 class="test-results-heading">Automated Test Results</h3>
      <div>
        <button class="btn btn-secondary btn-xs" onclick="runTests()">RUN TESTS AGAIN</button>
        <a href="index.html" class="btn btn-primary btn-xs test-open-app-btn"><span>OPEN CAMPUSBITE &rarr;</span></a>
      </div>
    </div>

    <div id="test-results-list" class="test-results-list-wrap"></div>
  </div>

  <script src="supabase.js"></script>
  <script src="app.js?v=5"></script>
  <script src="tests/campusbite_tests.js?v=8"></script>
  <script>
    async function runTests() {
      const listEl = document.getElementById('test-results-list');
      const badge = document.getElementById('status-badge');
      badge.className = 'badge-pass';
      badge.innerText = 'EXECUTING...';
      listEl.innerHTML = '<div class="test-row flex-center"><span class="metric-label-mono">Executing test suites...</span></div>';

      const t0 = performance.now();
      const results = await window.CampusBiteTests.executeAllTests();
      const totalTime = (performance.now() - t0).toFixed(1);

      const passedCount = results.filter(r => r.passed).length;
      const totalCount = results.length;
      const allPassed = passedCount === totalCount;

      document.getElementById('metric-total').innerText = totalCount;
      document.getElementById('metric-passed').innerText = `${passedCount}/${totalCount}`;
      document.getElementById('metric-time').innerText = `${totalTime} ms`;

      if (allPassed) {
        badge.className = 'badge-pass';
        badge.innerText = 'ALL PASSING ✓';
      } else {
        badge.className = 'badge-fail';
        badge.innerText = `${totalCount - passedCount} FAILED`;
      }

      listEl.innerHTML = results.map((r, idx) => `
        <div class="test-row">
          <div>
            <span class="timeline-actor-pill">#${String(idx + 1).padStart(2, '0')}</span>
            <strong>${r.name}</strong>
            ${r.error ? `<div class="status-pill out-of-stock">✕ ${r.error}</div>` : ''}
          </div>
          <div class="flex-between-center">
            <span class="test-status-pill ${r.passed ? 'pass' : 'fail'}">${r.passed ? 'PASS ✓' : 'FAIL ✕'}</span>
            <span class="test-meta">${r.time}ms</span>
          </div>
        </div>
      `).join('');
    }

    window.addEventListener('DOMContentLoaded', runTests);
  </script>
</body>
</html>
