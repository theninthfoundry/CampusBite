name: Frontend CI & Verification

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'web/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'web/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  validate-frontend:
    name: Validate Web Frontend (React + TS + Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Install Dependencies
        run: npm install

      - name: Strict TypeScript Verification
        run: npm run type-check

      - name: ESLint Check
        run: npm run lint

      - name: Run Unit & Component Tests
        run: npm run test

      - name: Production Bundle Build
        run: npm run build
